<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GT Planner · 工业生产规划器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">GT&nbsp;Planner <span>GregTech 工业生产规划器</span></div>
    <div id="stats-chips" class="chips"></div>
    <button id="lang-toggle" class="ghost lang-toggle" title="切换中英文">EN</button>
  </header>

  <nav class="tabs">
    <button data-tab="search" class="active">搜索</button>
    <button data-tab="material">材料</button>
    <button data-tab="planner">规划器</button>
    <button data-tab="graph">图谱</button>
  </nav>

  <main>
    <section id="tab-search" class="tab active">
      <div class="toolbar">
        <input id="search-input" placeholder="搜索材料：circuit / copper_ingot / quantum …（回车搜索）">
        <select id="search-kind">
          <option value="">全部类型</option>
          <option value="item">物品</option>
          <option value="fluid">流体</option>
        </select>
        <button id="search-btn">搜索</button>
      </div>
      <div id="search-results" class="panel"><div class="placeholder">输入关键词开始搜索</div></div>
    </section>

    <section id="tab-material" class="tab">
      <div id="material-content" class="panel"><div class="placeholder">从搜索结果点击一个材料查看详情</div></div>
    </section>

    <section id="tab-planner" class="tab">
      <div class="toolbar">
        <input id="plan-material" placeholder="目标材料 id（如 gtceu:quantum_processor）">
        <input id="plan-rate" type="number" value="60" min="0.001" step="any" class="num">
        <span class="unit">/min</span>
        <select id="plan-mode">
          <option value="tree">tree · 快速贪心</option>
          <option value="beam">beam · 局部搜索（推荐）</option>
          <option value="mcts">mcts · 蒙特卡洛树搜索</option>
          <option value="exact">exact · LP 精确</option>
        </select>
        <select id="plan-tier" title="最大电压等级">
          <option value="">不限等级</option>
          <option value="ULV">≤ ULV</option>
          <option value="LV">≤ LV</option>
          <option value="MV">≤ MV</option>
          <option value="HV">≤ HV</option>
          <option value="EV">≤ EV</option>
          <option value="IV">≤ IV</option>
          <option value="LuV">≤ LuV</option>
          <option value="ZPM">≤ ZPM</option>
          <option value="UV">≤ UV</option>
          <option value="UHV">≤ UHV</option>
        </select>
        <select id="plan-objective" title="多目标权重">
          <option value="">目标：balanced</option>
          <option value="economy">economy · 省料</option>
          <option value="power">power · 省电</option>
          <option value="speed">speed · 省时间</option>
        </select>
        <button id="plan-btn">生成计划</button>
        <button id="plan-process" class="ghost">流程图</button>
      </div>
      <div id="plan-result" class="panel"><div class="placeholder">输入目标材料与速率，生成生产计划</div></div>
    </section>

    <section id="tab-graph" class="tab">
      <div class="toolbar graph-controls">
        <input id="graph-material" placeholder="材料 id">
        <button id="graph-btn">加载图谱</button>
        <select id="graph-direction">
          <option value="up">上游（原料链）</option>
          <option value="down">下游（用途）</option>
          <option value="both">双向</option>
        </select>
        <label class="slider">深度 <input id="graph-depth" type="range" min="1" max="5" value="2"></label>
        <span id="graph-depth-val" class="unit">2</span>
        <label class="slider">节点上限 <input id="graph-maxnodes" type="range" min="50" max="1200" step="50" value="300"></label>
        <span id="graph-maxnodes-val" class="unit">300</span>
        <label class="slider">每配方输入 <input id="graph-maxinputs" type="range" min="1" max="20" value="6"></label>
        <span id="graph-maxinputs-val" class="unit">6</span>
        <label class="check"><input type="checkbox" id="graph-norecycle" checked> 隐藏回收</label>
        <label class="check"><input type="checkbox" id="graph-onlymat"> 只显示材料</label>
        <label class="check"><input type="checkbox" id="graph-nolabels"> 隐藏标签</label>
        <input id="graph-filter" class="filter-input" placeholder="高亮过滤：输入 id 片段…">
      </div>
      <div id="cy"></div>
      <div id="graph-status" class="graph-status"></div>
    </section>
  </main>

  <footer>
    <span>数据：JEI 导出 · 无时长/EU 数据 → 机器数量未计算</span>
    <span id="footer-status"></span>
  </footer>

  <script src="vendor/cytoscape.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
