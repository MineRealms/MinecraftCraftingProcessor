[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/server", "crates/gpu"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["gt-planner contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
log = "0.4"
env_logger = "0.11"

gt-planner-core = { path = "crates/core" }

[profile.release]
lto = "thin"
